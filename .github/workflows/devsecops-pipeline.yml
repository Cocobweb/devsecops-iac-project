name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 509521484299.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: devsecops-app

jobs:

  # ─── JOB 1 : Scan IaC Terraform ───────────────────────────────────────────
  checkov-terraform:
    name: Checkov — IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: false  # BLOQUE le pipeline si échec

  # ─── JOB 2 : Scan Dockerfile ──────────────────────────────────────────────
  checkov-docker:
    name: Checkov — Dockerfile Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./app
          framework: dockerfile
          output_format: cli
          soft_fail: false  # BLOQUE le pipeline si échec

  # ─── JOB 3 : Tests sécurité réseau ────────────────────────────────────────
  security-tests:
    name: Tests — Security Rules
    runs-on: ubuntu-latest
    needs: [checkov-terraform]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec
        run: tfsec . --soft-fail

      - name: Verify security rules in Terraform
        run: |
          echo "=== Vérification des règles de sécurité ==="
          FAILED=0

          # Vérifier que le port 22 SSH n'est pas ouvert publiquement
          if grep -E 'from_port\s*=\s*22' main.tf && grep -E 'cidr_blocks\s*=\s*\["0\.0\.0\.0/0"\]' main.tf; then
            echo "FAIL : Port 22 ouvert publiquement détecté"
            FAILED=1
          else
            echo "PASS : Port 22 non exposé publiquement"
          fi

          # Vérifier que IMDSv2 est forcé
          if grep -q 'http_tokens.*required' main.tf; then
            echo "PASS : IMDSv2 forcé"
          else
            echo "FAIL : IMDSv2 non forcé"
            FAILED=1
          fi

          # Vérifier que l'EC2 n'a pas d'IP publique
          if grep -q 'associate_public_ip_address = false' main.tf; then
            echo "PASS : EC2 sans IP publique"
          else
            echo "FAIL : EC2 avec IP publique"
            FAILED=1
          fi

          # Vérifier que le chiffrement EBS est activé
          if grep -q 'encrypted = true' main.tf; then
            echo "PASS : EBS chiffré"
          else
            echo "FAIL : EBS non chiffré"
            FAILED=1
          fi

          echo "==="
          if [ $FAILED -eq 1 ]; then
            echo "ECHEC : Un ou plusieurs tests de sécurité ont échoué — push bloqué."
            exit 1
          fi
          echo "=== Tous les tests sont passés ==="

  # ─── JOB 4 : Build + Trivy ────────────────────────────────────────────────
  trivy-scan:
    name: Trivy — Image Scan
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-app:latest ./app

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          exit-code: 1        # BLOQUE si vulnérabilités CRITICAL ou HIGH
          severity: CRITICAL,HIGH

  # ─── JOB 5 : Push ECR — conditionné par TOUS les jobs précédents ──────────
  push-ecr:
    name: Push — ECR
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker, security-tests, trivy-scan]
    # Ce job ne tourne QUE si tous les jobs précédents sont success
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ─── JOB 6 : Rapport de sécurité — tourne toujours ───────────────────────
  security-report:
    name: Report — Security Summary
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker, security-tests, trivy-scan]
    if: always()  # tourne même si les jobs précédents échouent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install checkov --break-system-packages
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          version: v0.69.3

      - name: Build Docker image for Trivy
        run: docker build -t devsecops-app:latest ./app


      - name: Generate security report
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          COMMIT=$(git rev-parse --short HEAD)

          {
            echo "# Security Scan Report"
            echo ""
            echo "**Date:** $DATE"
            echo "**Commit:** $COMMIT"
            echo "**Branch:** ${{ github.ref_name }}"
            echo ""
            echo "---"
            echo ""
            echo "## Checkov — Terraform IaC"
            echo '```'
            checkov -d . --framework terraform --compact 2>&1 || true
            echo '```'
            echo ""
            echo "## Checkov — Dockerfile"
            echo '```'
            checkov -d ./app --framework dockerfile --compact 2>&1 || true
            echo '```'
            echo ""
            echo "## tfsec — IaC Security"
            echo '```'
            tfsec . --soft-fail --no-color 2>&1 || true
            echo '```'
            echo ""
            echo "## Trivy — Image Vulnerabilities"
            echo '```'
            trivy image --severity CRITICAL,HIGH --no-progress --format table devsecops-app:latest 2>&1 || true
            echo '```'
            echo ""
            echo "## Security Rules Tests"
            echo '```'
            echo -n "Port 22 exposé publiquement : "
            (grep -qE 'from_port\s*=\s*22' main.tf && grep -qE 'cidr_blocks.*0\.0\.0\.0' main.tf) && echo "FAIL ❌" || echo "PASS ✅"
            echo -n "IMDSv2 forcé               : "
            grep -q 'http_tokens.*required' main.tf && echo "PASS ✅" || echo "FAIL ❌"
            echo -n "EC2 sans IP publique       : "
            grep -q 'associate_public_ip_address = false' main.tf && echo "PASS ✅" || echo "FAIL ❌"
            echo -n "EBS chiffré                : "
            grep -q 'encrypted = true' main.tf && echo "PASS ✅" || echo "FAIL ❌"
            echo '```'
          } > security-report.md

          echo "--- Rapport généré ---"
          cat security-report.md



      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.sha }}
          path: security-report.md
          retention-days: 30
