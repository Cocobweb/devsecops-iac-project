name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 509521484299.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: devsecops-app
  EC2_INSTANCE_ID: i-0fbcaff854a14a371

jobs:

  # ─── JOB 1 : Scan IaC Terraform ───────────────────────────────────────────
  checkov-terraform:
    name: Checkov — IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: false

  # ─── JOB 2 : Scan Dockerfile ──────────────────────────────────────────────
  checkov-docker:
    name: Checkov — Dockerfile Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./app
          framework: dockerfile
          output_format: cli
          soft_fail: false

  # ─── JOB 3 : Tests sécurité réseau ────────────────────────────────────────
  security-tests:
    name: Terraform Security Rules
    runs-on: ubuntu-latest
    needs: [checkov-terraform]
    steps:
      - uses: actions/checkout@v4
      - name: Install tfsec
        run: curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      - name: Run tfsec
        run: tfsec . --minimum-severity HIGH
      - name: Verify Terraform security rules
        run: |
          echo "=== Vérification des règles de sécurité ==="
          FAILED=0
          grep -E 'from_port\s*=\s*22' main.tf && grep -E 'cidr_blocks\s*=\s*\["0\.0\.0\.0/0"\]' main.tf && FAILED=1 || echo "SSH OK"
          grep -q 'http_tokens.*required' main.tf || FAILED=1
          grep -q 'associate_public_ip_address = false' main.tf || FAILED=1
          grep -q 'encrypted = true' main.tf || FAILED=1
          if [ $FAILED -eq 1 ]; then
            echo "ECHEC : sécurité Terraform non conforme"
            exit 1
          fi
          echo "=== Tous les tests de sécurité Terraform sont OK ==="

  # ─── JOB 4 : Build + Trivy ────────────────────────────────────────────────
  trivy-scan:
    name: Trivy — Image Scan
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t devsecops-app:latest ./app
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  # ─── JOB 5 : Tests d’intrusion simples ────────────────────────────────────
  intrusion-tests:
    name: Tests d’intrusion simples
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker, security-tests, trivy-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Install nmap
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Scan ports EC2
        run: |
          echo "=== Scan ports EC2 via nmap ==="
          nmap -Pn ${{ env.EC2_INSTANCE_ID }}  # ou IP privée si nécessaire
          # Ajouter des vérifications custom sur les ports exposés, accès non autorisé, etc.
          echo "=== Tests d'intrusion terminés ==="

  # ─── JOB 6 : Push ECR — conditionné sur succès de tous les scans et tests ──
  push-ecr:
    name: Push Docker image to ECR
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker, security-tests, trivy-scan, intrusion-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ─── JOB 7 : Déploiement EC2 via SSM ─────────────────────────────────────
  deploy-ec2:
    name: Deploy Docker container on EC2
    runs-on: ubuntu-latest
    needs: [push-ecr]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Pull & run Docker on EC2 via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Pull latest Docker image and run container" \
            --parameters 'commands=[
              "docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest",
              "docker stop devsecops-app || true",
              "docker rm devsecops-app || true",
              "docker run -d --name devsecops-app -p 80:80 $ECR_REGISTRY/$ECR_REPOSITORY:latest"
            ]'

  # ─── JOB 8 : Rapport de sécurité — toujours exécuté ──────────────────────
  security-report:
    name: Security Report — Always Run
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker, security-tests, trivy-scan]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          pip install checkov --break-system-packages
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          version: v0.69.3
      - name: Build Docker image for Trivy
        run: docker build -t devsecops-app:latest ./app
      - name: Generate security report
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          COMMIT=$(git rev-parse --short HEAD)
          {
            echo "# Security Scan Report"
            echo "**Date:** $DATE"
            echo "**Commit:** $COMMIT"
            echo "**Branch:** ${{ github.ref_name }}"
            echo ""
            echo "## Checkov — Terraform IaC"
            echo '```'
            checkov -d . --framework terraform --compact 2>&1 || true
            echo '```'
            echo "## Checkov — Dockerfile"
            echo '```'
            checkov -d ./app --framework dockerfile --compact 2>&1 || true
            echo '```'
            echo "## tfsec — IaC Security"
            echo '```'
            tfsec . --soft-fail --no-color 2>&1 || true
            echo '```'
            echo "## Trivy — Image Vulnerabilities"
            echo '```'
            trivy image --severity CRITICAL,HIGH --no-progress --format table devsecops-app:latest 2>&1 || true
            echo '```'
          } > security-report.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.sha }}
          path: security-report.md
          retention-days: 30
