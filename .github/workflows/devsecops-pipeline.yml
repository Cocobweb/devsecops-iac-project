name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 509521484299.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: devsecops-app

jobs:

  # ─── JOB 1 : Scan IaC Terraform ───────────────────────────────────────────
  checkov-terraform:
    name: Checkov — IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: true  # ne bloque pas le pipeline, juste un rapport

  # ─── JOB 2 : Scan Dockerfile ──────────────────────────────────────────────
  checkov-docker:
    name: Checkov — Dockerfile Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./app
          framework: dockerfile
          output_format: cli
          soft_fail: true

  # ─── JOB 3 : Build + Trivy ────────────────────────────────────────────────
  trivy-scan:
    name: Trivy — Image Scan
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-app:latest ./app

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          exit-code: 0        # 0 = ne bloque pas, 1 = bloque si vulnérabilités
          severity: CRITICAL,HIGH

  # ─── JOB 4 : Push ECR ─────────────────────────────────────────────────────
  push-ecr:
    name: Push — ECR
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

