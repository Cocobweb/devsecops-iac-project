name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 509521484299.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: devsecops-app

jobs:

  # ─── JOB 1 : Scan IaC Terraform ───────────────────────────────────────────
  checkov-terraform:
    name: Checkov — IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: false

  # ─── JOB 2 : Scan Dockerfile ──────────────────────────────────────────────
  checkov-docker:
    name: Checkov — Dockerfile Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./app
          framework: dockerfile
          output_format: cli
          soft_fail: false

  # ─── JOB 3 : Tests sécurité réseau ────────────────────────────────────────
  security-tests:
    name: Tests — Security Rules
    runs-on: ubuntu-latest
    needs: [checkov-terraform]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec
        run: tfsec . --soft-fail

      - name: Verify security rules in Terraform
        run: |
          echo "=== Vérification des règles de sécurité ==="
          FAILED=0

          if grep -E 'from_port\s*=\s*22' main.tf && grep -E 'cidr_blocks\s*=\s*\["0\.0\.0\.0/0"\]' main.tf; then
            echo "FAIL : Port 22 ouvert publiquement détecté"
            FAILED=1
          else
            echo "PASS : Port 22 non exposé publiquement"
          fi

          if grep -q 'http_tokens.*required' main.tf; then
            echo "PASS : IMDSv2 forcé"
          else
            echo "FAIL : IMDSv2 non forcé"
            FAILED=1
          fi

          if grep -q 'associate_public_ip_address = false' main.tf; then
            echo "PASS : EC2 sans IP publique"
          else
            echo "FAIL : EC2 avec IP publique"
            FAILED=1
          fi

          if grep -q 'encrypted = true' main.tf; then
            echo "PASS : EBS chiffré"
          else
            echo "FAIL : EBS non chiffré"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

  # ─── JOB 4 : Build + Trivy ────────────────────────────────────────────────
  trivy-scan:
    name: Trivy — Image Scan
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-app:latest ./app

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  # ─── JOB 5 : Push ECR ────────────────────────────────────────────────────
  push-ecr:
    name: Push — ECR
    runs-on: ubuntu-latest
    needs: [checkov-terraform, checkov-docker, security-tests, trivy-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ─── JOB 6 : Tests d’intrusion simples ───────────────────────────────────
  intrusion-tests:
    name: Tests d’intrusion simples
    runs-on: ubuntu-latest
    needs: [push-ecr]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Scanner les ports
        run: |
          # Remplacez par IP interne de test si nécessaire
          TARGET_IP="10.0.1.5"
          echo "Scanning $TARGET_IP..."
          nmap -Pn $TARGET_IP > nmap-output.txt
          if grep -q "filtered" nmap-output.txt; then
            echo "Attention: certains ports sont filtrés ou fermés"
          fi
          cat nmap-output.txt

      - name: Vérifier accès non autorisé / règles exposées
        run: |
          FAILED=0
          # Exemple simple : port 22 ne doit pas être ouvert
          if grep -E '22/tcp open' nmap-output.txt; then
            echo "FAIL : Port SSH ouvert publiquement"
            FAILED=1
          else
            echo "PASS : Port SSH non exposé"
          fi

          # Autres vérifications à rajouter selon besoin
          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

  # ─── JOB 7 : Déploiement sur EC2 via SSM ────────────────────────────────
  deploy-ec2:
    name: Déploiement sur EC2 via SSM
    runs-on: ubuntu-latest
    needs: [intrusion-tests]  # ne se lance que si intrusion-tests OK
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Déployer sur EC2 via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=web-instance" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "Instance ID: $INSTANCE_ID"

          aws ssm send-command \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Pull dernier code et déploiement Docker" \
            --parameters 'commands=[
              "docker pull 509521484299.dkr.ecr.eu-north-1.amazonaws.com/devsecops-app:latest",
              "docker stop devsecops-app || true",
              "docker rm devsecops-app || true",
              "docker run -d --name devsecops-app -p 80:80 509521484299.dkr.ecr.eu-north-1.amazonaws.com/devsecops-app:latest"
            ]'
